# Primary Desktop thread: planning, delegation, review, and integration.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true

# Keep this restrained. Parallel write agents are difficult to coordinate.
max_concurrent_threads_per_session = 3

# Any unnamed subagent also defaults to Luna.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
