<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07101f" />
    <meta name="description" content="A deterministic voxel city simulation." />
    <link rel="icon" href="/icon-192.png" />
    <title>Idle City</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Idle City 3D scene"></canvas>
      <section class="overlay" aria-label="Idle City status">
        <h1>Idle City</h1>
        <div class="stats" aria-live="polite">
          <p><span>Data</span><strong id="data-value">10</strong></p>
          <p><span>Population</span><strong id="population-value">4</strong></p>
          <p><span>Tick</span><strong id="tick-value">0</strong></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
