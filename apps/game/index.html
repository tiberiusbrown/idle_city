<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07101f" />
    <meta name="description" content="A deterministic voxel city simulation." />
    <link rel="icon" href="/icon-192.png" />
    <title>Idle City</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Idle City 3D scene"></canvas>
      <section class="overlay" aria-label="Idle City status">
        <h1>Idle City</h1>
        <div class="stats" aria-live="polite">
          <p><span>Data</span><strong id="data-value">10</strong></p>
          <p><span>Population</span><strong id="population-value">4</strong></p>
          <p><span>Completed home capacity</span><strong id="home-capacity-value">0</strong></p>
          <p><span>Completed work capacity</span><strong id="work-capacity-value">0</strong></p>
          <p><span>Construction workers</span><strong id="construction-workers-value">0</strong></p>
          <p><span>Tick</span><strong id="tick-value">0</strong></p>
        </div>
        <p id="assignment-status" class="assignment-status" aria-live="polite">
          Home assignments: 0/0 · Work assignments: 0/0
        </p>
        <p id="construction-status" class="construction-status" aria-live="polite">
          No active construction.
        </p>
        <div class="zone-controls" role="group" aria-label="Zone placement">
          <p class="zone-heading">Place a zone</p>
          <button
            id="living-zone-button"
            data-zone-type="living"
            type="button"
            aria-pressed="false"
          >
            Living · 4 Data
          </button>
          <button
            id="working-zone-button"
            data-zone-type="working"
            type="button"
            aria-pressed="false"
          >
            Working · 6 Data
          </button>
          <button
            id="leisure-zone-button"
            data-zone-type="leisure"
            type="button"
            aria-pressed="false"
          >
            Leisure · 40 Data
          </button>
          <button id="cancel-zone-button" type="button">Cancel</button>
        </div>
        <p id="placement-status" class="placement-status" role="status" aria-live="polite">
          Select a zone type, then click the grid to place it.
        </p>
        <div class="speed-controls" role="group" aria-label="Simulation speed">
          <button id="pause-button" type="button">Pause</button>
          <button id="normal-button" type="button">Normal</button>
          <button id="fast-button" type="button">Fast</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
